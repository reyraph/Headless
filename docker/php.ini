; Socket MySQL local, utilisé par WordPress (DB_HOST=localhost)
mysqli.default_socket = /run/mysqld/mysqld.sock

; Imports .wpress de All-in-One WP Migration
upload_max_filesize = 512M
post_max_size = 512M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
max_input_vars = 3000

expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
date.timezone = Europe/Zurich
